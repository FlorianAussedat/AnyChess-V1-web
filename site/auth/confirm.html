      padding: 28px 20px;

    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; font-weight: 700; }
    p { margin: 0; font-size: 18px; line-height: 1.5; overflow-wrap: anywhere; }
    .alt { margin-top: 16px; color: #8FB0CC; font-size: 16px; }
    form[hidden], #open[hidden] { display: none; }
    label { display: block; margin: 16px 0 6px; font-size: 16px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #1C3558;
      background: #0B1728;
      color: #DCE8F5;
      font-size: 18px;
    }
    button, a.open {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 20px;
      min-height: 48px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #F5A623;
      color: #0B1728;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
    }
    a.open:focus-visible, button:focus-visible { outline: 3px solid #DCE8F5; outline-offset: 3px; }
    #recover-error { margin-top: 12px; }
    noscript p { margin: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="/brand/anychess-logo.png" alt="AnyChess" width="280" height="97" />
      <h1 id="title">AnyChess</h1>
      <p id="message">Vérification du lien…</p>
      <a id="open" class="open" href="intent://utilisateur#Intent;scheme=anychess;package=com.anychess.standalone;end">Ouvrir AnyChess</a>
      <p id="alt" class="alt">Tu peux aussi fermer cette page et ouvrir l’application.</p>
      <form id="recover" hidden="hidden">
        <label id="label-password" for="password">Nouveau mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" />
        <label id="label-password2" for="password2">Confirme le mot de passe</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="6" />
        <button id="recover-submit" type="submit">Enregistrer le mot de passe</button>
        <p id="recover-error"></p>
      </form>
    </div>
  </main>
  <noscript><p>Ouvre le lien reçu par e-mail pour l’activer. Tu peux aussi retourner dans AnyChess. Open the link from the email to activate it. You can also return to AnyChess.</p></noscript>

function interpretConfirmationLocation(search, hash) {
  var query = new URLSearchParams(search.charAt(0) === '?' ? search.slice(1) : search);
  var rawHash = hash.charAt(0) === '#' ? hash.slice(1) : hash;
  var fragment = new URLSearchParams(rawHash);
  var error = query.get('error') || fragment.get('error') || '';
  var errorCode = (query.get('error_code') || fragment.get('error_code') || '').toLowerCase();

  var access = query.get('access_token') || fragment.get('access_token') || '';
  var type = (query.get('type') || fragment.get('type') || '').toLowerCase();
  if (error || errorCode) {
    if (error === 'server_error' || errorCode === 'unexpected_failure' || errorCode === 'request_timeout') {
      return 'unavailable';
    }
    if (errorCode === 'otp_expired' || errorCode === 'otp_disabled' || /expired|invalid/i.test(description)) {
      return 'expired';
    }
    return 'invalid';
  }
  if (access && type === 'recovery') return 'recover';
  if (type === 'recovery' || type === 'magiclink' || type === 'invite' || type === 'email_change') {
    return 'other';
  }
  if (query.get('code') && !access) return 'unavailable';
  if (access && (type === 'signup' || type === 'email')) return 'verify';
  return 'idle';
}
function userEmailIsConfirmed(body) {
  if (!body || typeof body !== 'object') return false;
  var row = body.user && typeof body.user === 'object' ? body.user : body;
  var stamp = row.email_confirmed_at || row.confirmed_at;
  return typeof stamp === 'string' && stamp.trim().length > 0;
}
function pageLanguage(search, navigatorLanguage) {
  var query = new URLSearchParams(search.charAt(0) === '?' ? search.slice(1) : search);
  var value = (query.get('lang') || '').toLowerCase();
  if (value === 'fr' || value === 'en') return value;
  var nav = (navigatorLanguage || '').toLowerCase();
  if (nav.indexOf('en') === 0) return 'en';
  return 'fr';
}
function pageClient(search) {
  var query = new URLSearchParams(search.charAt(0) === '?' ? search.slice(1) : search);
  var value = (query.get('client') || '').toLowerCase();
  if (value === 'dev') return 'dev';
  return 'app';
}
function appOpenHref(client, userAgent) {
  var android = /Android/i.test(userAgent || '');
  if (client === 'dev') {
    return android
      ? 'intent://utilisateur#Intent;scheme=exp+mobile;package=com.anychess.app;end'
      : 'exp+mobile://utilisateur';
  }
  return android
    ? 'intent://utilisateur#Intent;scheme=anychess;package=com.anychess.standalone;end'
    : 'anychess://utilisateur';
}
