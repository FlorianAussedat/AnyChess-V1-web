plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stockfishuci'
version = '0.1.0'

def fetchScript = file("${project.projectDir}/../scripts/fetch-android-binary.mjs")

tasks.register('fetchStockfishBinary', Exec) {
  description = 'Download official Stockfish 19 Android arm64 binary into jniLibs'
  workingDir project.projectDir
  commandLine 'node', fetchScript.absolutePath
  inputs.file(file("${project.projectDir}/../scripts/stockfish-android-manifest.json"))
  outputs.file(file("${project.projectDir}/src/main/jniLibs/arm64-v8a/libstockfish.so"))
}

afterEvaluate {
  tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'fetchStockfishBinary'
  }
}

android {
  namespace "expo.modules.stockfishuci"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  packagingOptions {
    jniLibs {
      keepDebugSymbols += ['**/libstockfish.so']
      useLegacyPackaging = true
    }
  }
}
